<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하남돼지집 서호수점 — 캠페인 성과 대시보드</title>
<meta property="og:title" content="하남돼지집 서호수점 — 캠페인 성과 대시보드">
<meta property="og:description" content="2026-07-20 ~ 08-02 · Meta 광고 + 웹페이지 계측 · 3페이지">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hanam-bbq-tayho.vercel.app/docs/dashboard/web-ops-v2-1p.png">
<style>
:root{--red:#E60012;--c100:#1A1A1A;--c70:#616161;--c45:#939393;
      --lg:#E9E9E9;--ivory:#FFF9F2;--surf:#FFFFFF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--c100);
     font-family:system-ui,"Segoe UI","Malgun Gothic",sans-serif;
     -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* 상단 바 — 3개 페이지를 오가는 유일한 조작부 */
.nav{flex:0 0 auto;background:var(--surf);border-bottom:1px solid var(--lg);
     border-top:3px solid var(--red);padding:9px 16px;
     display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nav .ttl{font-size:14px;font-weight:700;line-height:1.2}
.nav .sub{font-size:9.5px;color:var(--c45);margin-top:1px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs a{font-size:11px;line-height:1.3;text-decoration:none;color:var(--c70);
        border:1px solid var(--lg);background:var(--surf);border-radius:14px;
        padding:5px 12px;white-space:nowrap;transition:.12s}
.tabs a:hover{border-color:var(--c45);color:var(--c100)}
.tabs a.on{background:var(--c100);border-color:var(--c100);color:#fff}
.tabs a .n{font-weight:700;margin-right:4px;opacity:.6}
.tabs a.on .n{opacity:.75}

/* 본문 — 각 페이지를 iframe으로 그대로 얹는다.
   3개 파일이 저마다 자기 JS를 갖고 있어 한 문서에 합치면 전역이 충돌한다.
   iframe이면 원본을 한 글자도 고치지 않고 그대로 쓸 수 있다. */
.stage{flex:1 1 auto;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ivory)}
iframe.on{display:block}

.hint{flex:0 0 auto;background:var(--surf);border-top:1px solid var(--lg);
      padding:5px 16px;font-size:9.5px;color:var(--c45)}
@media(max-width:700px){
  .nav{padding:8px 12px;gap:8px}
  .nav .ttl{font-size:12.5px}
  .tabs{margin-left:0;width:100%}
  .tabs a{flex:1;text-align:center;padding:6px 4px}
}
</style>

<div class="nav">
  <div>
    <div class="ttl">하남돼지집 서호수점 — 캠페인 성과 대시보드</div>
    <div class="sub">2026-07-20 ~ 08-02 · Meta 광고 + Amplitude 웹 계측 · 하노이 시각</div>
  </div>
  <div class="tabs" id="tabs">
    <a href="#p1" data-p="p1"><span class="n">1</span>종합 요약</a>
    <a href="#p2" data-p="p2"><span class="n">2</span>Meta 광고 운영</a>
    <a href="#p3" data-p="p3"><span class="n">3</span>웹페이지 운영</a>
  </div>
</div>

<div class="stage">
  <iframe id="p1" data-src="exec-v2.html" title="1페이지 종합 요약"></iframe>
  <iframe id="p2" data-src="meta-ops-v4.html" title="2페이지 Meta 광고 운영"></iframe>
  <iframe id="p3" data-src="web-ops-v2-1p.html" title="3페이지 웹페이지 운영"></iframe>
</div>

<div class="hint">1페이지 종합 요약 · 2페이지 Meta 광고 운영(스크롤) · 3페이지 웹페이지 운영 — 좁은 화면에서는 가로로 축소되어 표시됩니다. 확대해서 보세요.</div>

<script>
const PAGES=['p1','p2','p3'];
/* iframe은 처음 열 때만 로드한다. 3개를 한꺼번에 띄우면 모바일에서 느리다. */
function show(p){
  if(!PAGES.includes(p))p=PAGES[0];
  PAGES.forEach(id=>{
    const f=document.getElementById(id),on=id===p;
    if(on&&!f.src)f.src=f.dataset.src;
    f.classList.toggle('on',on);
  });
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'p1');
</script>
</html>
